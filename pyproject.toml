[project]
name = "domiq-mqtt"
version = "0.1.0"
description = "Bridge between the DOMIQ Base TCP integration port and an MQTT broker"
authors = [{ name = "Michal Jonik" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "aiomqtt>=2.5,<3",
]

[project.scripts]
domiq-mqtt = "domiq_mqtt.__main__:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC109", "ASYNC110"]
