# Self-hosted Renovate (no Mend app). Rules live in renovate.json; this runs it daily.
# RENOVATE_TOKEN = fine-grained PAT limited to this repository: Contents, Pull requests,
# Issues, Workflows and Commit statuses read/write, Dependabot alerts read.
name: Renovate

on:
  schedule:
    - cron: "17 3 * * *"   # daily; when PRs may open is set by "schedule" in renovate.json
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Lookup only, no pull requests"
        type: boolean
        default: false
      logLevel:
        type: choice
        options: [info, debug]
        default: info

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        with:
          configurationFile: .github/renovate-global.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'lookup' || '' }}
