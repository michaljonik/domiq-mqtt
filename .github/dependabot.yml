version: 2
updates:
  # Python base image (both FROM lines) and the uv image
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  # uv.lock
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  # all action bumps in one pull request (one build instead of one per action)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
